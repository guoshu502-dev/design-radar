<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Design Radar | COSTWAY</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6f9;color:#202234;font:14px system-ui,sans-serif}header{background:#fff;border-bottom:1px solid #e4e6ef;padding:22px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small{color:#777}main{max-width:1450px;margin:auto;padding:30px 5%}.stats,.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.stat,article{background:white;border:1px solid #e5e7ef;border-radius:14px;padding:16px}.stat b{display:block;font-size:30px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}select,button{padding:10px 14px;border:1px solid #ddd;border-radius:8px;background:white;color:#222}button{cursor:pointer}article img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#eef0f4;border-radius:8px}article h3{margin:12px 0 5px}a{color:#5145cd;text-decoration:none}.empty{background:#eef0f4;padding:40px;text-align:center;border-radius:8px;color:#777}.pill{font-size:12px;color:#5951b7}dialog{width:min(1100px,95vw);border:0;border-radius:16px;padding:24px}dialog::backdrop{background:#1119}.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare img{width:100%}footer{color:#777;margin:30px 0}</style><header><h1>◈ Design Radar <small> / COSTWAY</small></h1><small id="time">正在读取</small></header><main><h2>竞品设计动态</h2><p>美国站 · 首屏视觉 · 每日三次自动巡检</p><div class="stats" id="stats"></div><div class="toolbar"><select id="brand"><option value="">全部品牌</option></select><select id="device"><option value="">全部设备</option><option>PC</option><option>Mobile</option></select><select id="mode"><option value="latest">最新截图</option><option value="candidate">疑似更新</option><option value="history">历史版本</option></select><button id="refresh">刷新数据</button></div><div id="grid" class="grid"></div><footer>像素差异 ≥8% 为疑似变化，不代表已确认改版；轮播、弹窗和地区差异可能误报。访问失败不代表网站没有更新。</footer></main><dialog id="detail"><button id="close">关闭</button><h2 id="detailTitle"></h2><div class="compare" id="compare"></div></dialog><script>const $=id=>document.getElementById(id);let state;const el=(tag,text)=>{let n=document.createElement(tag);if(text!=null)n.textContent=text;return n};function render(){let s=state, b=$('brand').value,d=$('device').value,m=$('mode').value;let latest=new Map();s.snapshots.forEach(x=>{let k=x.brand+'/'+x.device;if(!latest.has(k))latest.set(k,x)});$('stats').replaceChildren(...[['监控品牌',s.sites.length],['已采集设备',latest.size],['疑似更新记录',s.snapshots.filter(x=>x.kind==='candidate').length],['最近巡检失败',s.checks.filter(x=>x.status==='error').length]].map(([k,v])=>{let n=el('div',k);n.className='stat';n.append(el('b',v));return n}));let rows=m==='latest'?s.sites.flatMap(x=>['PC','Mobile'].map(device=>latest.get(x.name+'/'+device)||{brand:x.name,device,url:x.url})):s.snapshots.filter(x=>m==='history'||x.kind==='candidate');$('grid').replaceChildren();for(let x of rows.filter(x=>(!b||b===x.brand)&&(!d||d===x.device))){let n=el('article'),check=s.checks.find(y=>y.brand===x.brand&&y.device===x.device);if(x.image){let img=el('img');img.src=x.image;img.loading='lazy';n.append(img)}else{let p=el('div','尚无真实截图');p.className='empty';n.append(p)}n.append(el('h3',x.brand+' · '+x.device));let a=el('a','访问官网 ↗');a.href=x.url;a.target='_blank';a.rel='noopener';n.append(a,el('p',x.ts?new Date(x.ts).toLocaleString():'等待首次采集'),el('p',x.kind==='candidate'?'疑似变化 '+(x.score*100).toFixed(1)+'%':x.kind==='baseline'?'首次基线':'尚未采集'));if(check)n.append(el('small',check.status==='error'?'最近巡检失败：'+check.message:'最近巡检：'+check.message));if(x.image){let btn=el('button','查看 / 对比');btn.onclick=()=>{ $('detailTitle').textContent=x.brand+' · '+x.device;let old=s.snapshots.find(y=>y.id===x.previous);$('compare').replaceChildren(...[[old,'旧版'],[x,'新版']].map(([y,l])=>{let z=el('div',l);if(y){let im=el('img');im.src=y.image;z.append(im)}else z.append(el('p','没有可用旧截图'));return z}));$('detail').showModal()};n.append(el('p'),btn)}$('grid').append(n)}if(!$('grid').children.length)$('grid').append(el('p','暂无符合条件的记录'))}async function load(){try{let r=await fetch('state.json?ts='+Date.now());if(!r.ok)throw Error(r.status);state=await r.json();let b=$('brand'),v=b.value;b.replaceChildren(new Option('全部品牌',''),...state.sites.map(x=>new Option(x.name,x.name)));b.value=v;$('time').textContent=state.last_run?'最近巡检：'+new Date(state.last_run).toLocaleString():'等待首次巡检';render()}catch(e){$('time').textContent='读取失败，请通过 GitHub Pages 或本地 HTTP 服务打开'}}['brand','device','mode'].forEach(i=>$(i).onchange=render);$('refresh').onclick=load;$('close').onclick=()=>$('detail').close();load();setInterval(load,60000)</script></html>
