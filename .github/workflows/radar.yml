name: Design Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 8,16 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: 'design-radar-github (1)'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: python scan.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RADAR_AI_MODEL: ${{ vars.RADAR_AI_MODEL }}
          FULL_SCAN: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 0 * * *') && '1' || '0' }}
      - run: |
          git config user.name 'design-radar[bot]'
          git config user.email 'design-radar@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || git commit -m 'Update competitor snapshots'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'design-radar-github (1)/docs'
      - uses: actions/deploy-pages@v4
        id: deployment
