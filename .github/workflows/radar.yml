name: Design Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,8,16 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: python scan.py
      - run: |
          git config user.name 'design-radar[bot]'
          git config user.email 'design-radar@users.noreply.github.com'
          git add docs
          git diff --cached --quiet || git commit -m 'Update competitor snapshots'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
